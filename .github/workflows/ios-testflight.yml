# Gera o app iOS num Mac do GitHub e envia ao TestFlight (App Store Connect).
# Roda manualmente: aba Actions > "iOS · TestFlight" > Run workflow.
#
# Segredos (Settings > Secrets and variables > Actions > Secrets):
#   APPLE_TEAM_ID       Team ID da conta Apple Developer (10 caracteres)
#   ASC_KEY_ID          Key ID da chave de API do App Store Connect
#   ASC_ISSUER_ID       Issuer ID da chave de API
#   ASC_KEY_P8          Conteúdo do arquivo AuthKey_XXXX.p8 (texto completo, com BEGIN/END)
# Variáveis (mesma tela, aba Variables) — sem elas o app usa anúncios de TESTE:
#   ADMOB_APP_ID_IOS    ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
#   ADMOB_BANNER_ID_IOS ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
name: iOS · TestFlight

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão exibida na App Store (ex.: 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      ADMOB_BANNER_ID_IOS: ${{ vars.ADMOB_BANNER_ID_IOS }}
      ADMOB_TESTING: ${{ vars.ADMOB_BANNER_ID_IOS != '' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Xcode mais recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Conferir segredos
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Falta o segredo $v (veja app/README.md)"; exit 1; fi
          done
          if [ "$ADMOB_TESTING" = "1" ]; then echo "::warning::ADMOB_BANNER_ID_IOS não definido: o build usará anúncios de teste."; fi

      - name: Instalar dependências
        run: npm ci

      - name: Gerar conteúdo do app a partir do site
        run: npm run build

      - name: Sincronizar projeto iOS
        run: npx cap sync ios

      - name: ID do app no AdMob
        if: vars.ADMOB_APP_ID_IOS != ''
        run: /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ${{ vars.ADMOB_APP_ID_IOS }}" ios/App/App/Info.plist

      - name: Chave da API do App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Arquivar (archive)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.versao }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Assinar e enviar ao TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Build ${{ inputs.versao }} (${{ github.run_number }}) enviado ao App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Em alguns minutos ele aparece em App Store Connect > TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
